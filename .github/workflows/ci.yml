name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      DB_NAME: test
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      TEST_DB_URL: sqlite+aiosqlite:///./test.db
      SECRET_KEY: test-secret-key-change-me-32-chars-min
      ALGORITHM: HS256

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q