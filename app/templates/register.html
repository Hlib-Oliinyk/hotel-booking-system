{% extends "base.html" %}

{% block title %}Реєстрація — HotelBook{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Реєстрація</h1>
        <p>Створіть акаунт для бронювання готелів</p>

        <div id="register-alert"></div>

        <form class="auth-form" id="register-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="reg-password" placeholder="Мінімум 6 символів" required autocomplete="new-password" minlength="6">
            </div>
            <div class="form-group">
                <label>Підтвердження пароля</label>
                <input type="password" id="reg-password2" placeholder="Повторіть пароль" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary" id="register-btn">Зареєструватись</button>
        </form>

        <div class="auth-footer">
            Вже є акаунт? <a href="/login">Увійти</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    const btn = document.getElementById('register-btn');
    const alertContainer = document.getElementById('register-alert');

    if (password !== password2) {
        showAlert(alertContainer, 'Паролі не збігаються');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Реєстрація...';

    try {
        await API.post('/auth/register', { email, password });
        await API.post('/auth/login', { email, password });
        window.location.href = '/';
    } catch (e) {
        showAlert(alertContainer, e.message || 'Помилка реєстрації');
        btn.disabled = false;
        btn.textContent = 'Зареєструватись';
    }
});
</script>
{% endblock %}
