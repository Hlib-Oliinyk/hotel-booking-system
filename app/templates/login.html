{% extends "base.html" %}

{% block title %}Увійти — HotelBook{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Вхід</h1>
        <p>Увійдіть, щоб бронювати готелі та керувати своїми поїздками</p>

        <div id="login-alert"></div>

        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn">Увійти</button>
        </form>

        <div class="auth-footer">
            Немає акаунту? <a href="/register">Зареєструватись</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const urlParams = new URLSearchParams(window.location.search);
const nextUrl = urlParams.get('next') || '/';

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const alertContainer = document.getElementById('login-alert');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Вхід...';

    try {
        await API.post('/auth/login', { email, password });
        window.location.href = nextUrl;
    } catch (e) {
        showAlert(alertContainer, e.message || 'Невірний email або пароль');
        btn.disabled = false;
        btn.textContent = 'Увійти';
    }
});

document.addEventListener('DOMContentLoaded', async () => {
    try {
        await API.get('/auth/me');
        window.location.href = '/';
    } catch {}
});
</script>
{% endblock %}
